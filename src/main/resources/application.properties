server.port=${PORT:8083}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Three lines below only runs when started in IDE, if started through docker, the environment variables gets injected into Spring automatically.
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# GitHub Login
spring.security.oauth2.client.registration.github.client-id=${GITHUBCLIENTID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUBCLIENTSECRET}

# Google Login

spring.security.oauth2.client.registration.google.client-id=${GOOGLECLIENTID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLECLIENTSECRET}